<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="manus-game-loading-screen" content="1">
  <title>Наша маленькая история</title>
  $GODOT_HEAD_INCLUDE
  <style>
    :root { color-scheme: dark; font-family: "Trebuchet MS", Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#24182d; }
    body { display:grid; place-items:center; background:radial-gradient(circle at 50% 20%, #6f4966 0%, #31223a 52%, #17121e 100%); }
    canvas { position:absolute; inset:0; width:100%; height:100%; outline:none; }
    #loading { position:relative; z-index:2; width:min(560px, calc(100vw - 34px)); padding:30px 34px 28px; text-align:center; border:2px solid #efb69e; border-radius:28px; background:rgba(37,24,46,.94); box-shadow:0 18px 70px rgba(0,0,0,.35); color:#fff0d0; }
    #loading:before { content:'♥'; display:block; color:#f38da7; font-size:42px; line-height:1; margin-bottom:8px; animation:pulse 1.8s ease-in-out infinite; }
    h1 { margin:0 0 12px; font-size:clamp(24px, 5vw, 42px); font-weight:700; letter-spacing:.02em; }
    #loading-status { margin:8px 0 16px; color:#f5cbb7; font-size:17px; }
    progress { appearance:none; width:100%; height:14px; border:1px solid #f2c1a4; border-radius:20px; overflow:hidden; background:#47334d; }
    progress::-webkit-progress-bar { background:#47334d; border-radius:20px; }
    progress::-webkit-progress-value { background:linear-gradient(90deg,#e48ba4,#f4c48e); border-radius:20px; }
    progress::-moz-progress-bar { background:linear-gradient(90deg,#e48ba4,#f4c48e); border-radius:20px; }
    #loading-notice { color:#edc8b8; font-size:14px; margin:16px 0 8px; }
    button { border:2px solid #efb69e; border-radius:14px; padding:10px 24px; color:#fff0d0; background:#76506d; font-size:16px; cursor:pointer; }
    button:hover { background:#a45f75; }
    noscript { display:block; margin-top:16px; color:#f4b4ae; }
    @keyframes pulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { #loading:before { animation:none; } }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">Ваш браузер не поддерживает Canvas.</canvas>
  <section id="loading" role="status">
    <h1>Наша маленькая история</h1>
    <p id="loading-status">Загружаем маленькое приключение…</p>
    <progress id="loading-progress" aria-label="Прогресс загрузки"></progress>
    <p id="loading-notice" hidden></p>
    <button id="loading-retry" type="button" hidden>Повторить</button>
    <noscript>Для запуска игры необходим JavaScript.</noscript>
  </section>
  <script>
    (() => {
      const config = $GODOT_CONFIG;
      const threads = $GODOT_THREADS_ENABLED;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      let failed = false, ready = false, downloaded = 0, lastProgress = performance.now();
      const fail = (error) => { if (failed || ready) return; failed = true; console.error('[game-loading]', error); status.textContent = 'Не удалось загрузить игру. Попробуйте ещё раз.'; progress.hidden = true; retry.hidden = false; notice.hidden = true; };
      const onError = (event) => fail(event.error || new Error('Ошибка запуска'));
      window.addEventListener('error', onError);
      window.addEventListener('unhandledrejection', (event) => fail(event.reason || new Error('Ошибка запуска')));
      retry.addEventListener('click', () => window.location.reload());
      const onProgress = (current, total) => {
        if (failed || ready) return;
        if (Number.isFinite(current) && current > downloaded) { downloaded = current; lastProgress = performance.now(); }
        if (Number.isFinite(total) && total > 0 && Number.isFinite(current)) { progress.max = total; progress.value = Math.min(current, total); status.textContent = current >= total ? 'Запускаем игру…' : `Загрузка: ${Math.floor(current / total * 100)}%`; }
      };
      setInterval(() => { if (!failed && !ready && performance.now() - lastProgress > 30000) { notice.hidden = false; notice.textContent = 'Загрузка идёт дольше обычного — можно подождать или повторить.'; retry.hidden = false; } }, 1000);
      const start = async () => {
        try {
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true; loading.hidden = true; window.removeEventListener('error', onError); canvas.focus();
        } catch (error) { fail(error); }
      };
      const script = document.createElement('script');
      script.src = '$GODOT_URL';
      script.addEventListener('load', start, { once:true });
      script.addEventListener('error', () => fail(new Error('Не удалось загрузить движок')), { once:true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
